<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    </meta>
    <title>{title}</title>
    <link rel="canonical" href="/contact.html">
    </link>

    <!-- Mata tages.  These are essential for all pages to ensure proper character encoding, 
            viewport settings, and descriptions that may be indexed by search engines.  -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="Cazz's Recipes" />
    <meta name="apple-mobile-web-app-title" content="Cazzs Cooking Community" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Cazz's Cooking Community website let's you browse the Family's favourite recipes">
    <meta name="author" content="Chris Cullin">

    <!-- Fonts and CSS styling -->
    <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/contact.css">

    <!-- These should remain for consistent branding and to support web app features across all pages. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/components/icons/chef.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/components/icons/app_icon_114x114.png">
    <link rel="manifest" href="/manifest.webmanifest">


</head>

<body>
    <main role="main" id="main">

        <!-- HEADER SECTION -->
        <header>
        </header>

        <!-- Form Section -->
        <section id="contactPopup" style="display:block">
            <div class="container">

                <!-- Contact Form -->
                <div class="row" id="formContainer">

                    <!-- heading 1 for Contact Popup -->
                    <div class="row">
                        <div class="twelve columns">
                            <h1 class="heading brand">Contact Cazz!</h1>
                            <br />
                        </div>
                    </div>

                    <form id="contactForm" action="https://formsubmit.co/ajax/cazz@miplace.com" method="POST">

                        <input type="hidden" name="_subject" value="Cazz's Cooking Community!">
                        <input type="hidden" name="Recipe Page" id="modal-recipe-url" value="">
                        <input type="hidden" name="_captcha" value="false">

                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Your Name">

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="Your Email">

                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required placeholder="Type your message here..."></textarea>

                        </br>
                        <button type="submit" class="button contact-btn">Send Message</button>
                        <!-- <span class="close-btn" onclick="closeContactPopup()">&times;</span> -->
                    </form>
                </div>

                <div id="successContainer" class="hidden-element">
                    <h2 class="heading brand success-title">Message Sent!</h2>
                    <p>Thanks for reaching out. Cazz will get back to you soon.</p>
                    <p class="timer-note">This window will close in a few seconds.</p>
                </div>
            </div>
        </section>

        <!-- FOOTER SECTION -->
        <footer>
        </footer>

    </main>
</body>
<script src="/scripts/common.js"></script>
<script src="/scripts/contact.js"></script>

</html>
